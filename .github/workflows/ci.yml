name: CI

# Phase 26.24 (بند ۲.۱): typecheck + lint + unit tests + build + all governance
# audits on every push/PR, plus live-PostgreSQL verification in a service
# container. The app lives in outputs/habibazar-web (defaults.run.working-directory).
on:
  push:
    branches: [feature/v2-enterprise-upgrade, main]
  pull_request:

defaults:
  run:
    working-directory: outputs/habibazar-web

jobs:
  quality:
    name: Type · Lint · Test · Build · Audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: outputs/habibazar-web/package-lock.json
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Governance audits (9)
        run: npm run audit
      - name: Build
        run: npm run build
        env:
          ADMIN_JWT_SECRET: ci-build-secret-placeholder-value

  live-pg:
    name: Live PostgreSQL verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hbz_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hbz_ci
      ADMIN_JWT_SECRET: ci-live-pg-secret-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: outputs/habibazar-web/package-lock.json
      - run: npm ci
      - name: Migrate + seed + smoke health
        run: npx tsx scripts/ci-live-pg.ts
