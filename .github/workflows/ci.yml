name: CI

# Phase 26.24 (بند ۲.۱): typecheck + lint + unit tests + build + all governance
# audits on every push/PR, plus live-PostgreSQL verification in a service
# container. The app lives at the repo root (flattened in Phase 26.26d).
on:
  push:
    branches: [feature/v2-enterprise-upgrade, main]
  pull_request:


jobs:
  quality:
    name: Type · Lint · Test · Build · Audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Governance audits (9)
        run: npm run audit
      - name: Security audit — fail on High/Critical
        run: npm audit --audit-level=high --omit=dev
      - name: Build
        run: npm run build
        env:
          ADMIN_JWT_SECRET: ci-build-secret-placeholder-value

  live-pg:
    name: Live PostgreSQL verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hbz_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hbz_ci
      ADMIN_JWT_SECRET: ci-live-pg-secret-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Migrate + seed + smoke health
        run: npx tsx scripts/ci-live-pg.ts

  regressions:
    name: Enterprise regression suites (live-PG)
    runs-on: ubuntu-latest
    # 26.25b بند ۰.۱: EVERY future phase must keep the whole enterprise history
    # green. Runs all committed verify-* / sim-* suites, each on its own DB.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      ADMIN_JWT_SECRET: ci-regressions-secret-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Run all regression suites
        run: npm run regressions

  load-test:
    name: Load / stress + memory watch (soft gate)
    runs-on: ubuntu-latest
    # Perf regression signal — soft gate: fails only on 5xx under load, never on
    # latency (thresholds print as warnings). 26.24b بند ۴.
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hbz_load
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hbz_load
      ADMIN_JWT_SECRET: ci-load-secret-placeholder
      NODE_ENV: production
      # 26.25 بند ۰: measure true 2xx throughput, not a 429 storm (test-only).
      RATE_LIMIT_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      # NODE_ENV=production makes npm ci omit devDependencies (tailwindcss,
      # types…) and the build fails — install the full tree explicitly.
      - run: npm ci --include=dev
      - name: Build
        run: npm run build
      - name: Migrate + seed BEFORE the server starts (no startup race)
        # the health endpoint's DB probe is SELECT 1, which succeeds on an EMPTY
        # database — waiting on it cannot guarantee the schema exists. Provision
        # deterministically instead (same path the live-pg job uses).
        run: npx tsx scripts/ci-live-pg.ts
      - name: Start server (next start) + wait on health
        run: |
          npx next start -p 3000 > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/api/health && break
            sleep 2
          done
      # 26.32: the module audit and the two class checks only find anything
      # against a RUNNING server — that is the whole point of the phase. Code
      # inspection missed these defects three phases in a row.
      - name: Module audit (every admin module, real status codes)
        run: npm run audit:modules
        env:
          AUDIT_BASE: http://127.0.0.1:3000
          AUDIT_STRICT: '1'
      - name: Error-class checks (double-submit + contract drift)
        run: npm run audit:modules:classes
        env:
          AUDIT_BASE: http://127.0.0.1:3000
          AUDIT_STRICT: '1'
      - name: Load test hot routes (status dist + p50/p95/p99) + 5-min RSS watch
        run: node scripts/load-test.mjs
        env:
          BASE: http://127.0.0.1:3000
          DURATION: '15'
          CONNECTIONS: '20'
          MEM_WATCH_SECONDS: '300'
      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

  e2e:
    name: Playwright E2E (portal + auth + admin)
    runs-on: ubuntu-latest
    # 26.26b بند ۳.۲: the portal/auth specs were only type-checked before; this
    # job actually RUNS them. workers:1 + RATE_LIMIT_DISABLED avoid the in-memory
    # login-limiter contention that flakes concurrent auth-heavy specs.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hbz_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hbz_e2e
      ADMIN_JWT_SECRET: ci-e2e-secret-placeholder
      NODE_ENV: production
      RATE_LIMIT_DISABLED: '1'
      # localhost (not 127.0.0.1): the portal cookie is Secure in production and
      # Playwright's request context only keeps Secure cookies on a trustworthy
      # origin — localhost qualifies, 127.0.0.1 does not (26.26d finding).
      PLAYWRIGHT_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      # NODE_ENV=production makes npm ci omit devDependencies — need the full
      # tree for next build + @playwright/test.
      - run: npm ci --include=dev
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Migrate + seed BEFORE the server starts (no startup race)
        run: npx tsx scripts/ci-live-pg.ts
      - name: Start server + wait on health
        run: |
          npx next start -p 3000 > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/api/health && break
            sleep 2
          done
      - name: Run E2E (workers=1)
        run: npx playwright test --workers=1
      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
