name: CI

# Phase 26.24 (بند ۲.۱): typecheck + lint + unit tests + build + all governance
# audits on every push/PR, plus live-PostgreSQL verification in a service
# container. The app lives in outputs/habibazar-web (defaults.run.working-directory).
on:
  push:
    branches: [feature/v2-enterprise-upgrade, main]
  pull_request:

defaults:
  run:
    working-directory: outputs/habibazar-web

jobs:
  quality:
    name: Type · Lint · Test · Build · Audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: outputs/habibazar-web/package-lock.json
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Governance audits (9)
        run: npm run audit
      - name: Build
        run: npm run build
        env:
          ADMIN_JWT_SECRET: ci-build-secret-placeholder-value

  live-pg:
    name: Live PostgreSQL verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hbz_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hbz_ci
      ADMIN_JWT_SECRET: ci-live-pg-secret-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: outputs/habibazar-web/package-lock.json
      - run: npm ci
      - name: Migrate + seed + smoke health
        run: npx tsx scripts/ci-live-pg.ts

  load-test:
    name: Load / stress + memory watch (soft gate)
    runs-on: ubuntu-latest
    # Perf regression signal — soft gate: fails only on 5xx under load, never on
    # latency (thresholds print as warnings). 26.24b بند ۴.
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hbz_load
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hbz_load
      ADMIN_JWT_SECRET: ci-load-secret-placeholder
      NODE_ENV: production
      # 26.25 بند ۰: measure true 2xx throughput, not a 429 storm (test-only).
      RATE_LIMIT_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: outputs/habibazar-web/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Start server (next start) + wait on health
        run: |
          npx next start -p 3000 > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/api/health?probe=live && break
            sleep 2
          done
      - name: Load test hot routes (status dist + p50/p95/p99) + 5-min RSS watch
        run: node scripts/load-test.mjs
        env:
          BASE: http://127.0.0.1:3000
          DURATION: '15'
          CONNECTIONS: '20'
          MEM_WATCH_SECONDS: '300'
      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
