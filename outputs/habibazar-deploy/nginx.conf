# ============================================================
# Nginx Configuration — Habibazar Platform
# Place in: /etc/nginx/conf.d/habibazar.conf
# Do NOT place in sites-available/sites-enabled (conf.d only)
#
# Ubuntu 24.04 default nginx.conf already defines in http {}:
#   sendfile, tcp_nopush, tcp_nodelay, keepalive_timeout,
#   types_hash_max_size, gzip on, access_log, error_log
# This file only adds what is specific to this platform.
# ============================================================

# ─────────────────────────────────────────────────────────────
# Cloudflare IP detection
# ─────────────────────────────────────────────────────────────
geo $realip_remote_addr $cloudflare_ip {
    default 0;
    # IPv4
    103.21.244.0/22  1;
    103.22.200.0/22  1;
    103.31.4.0/22    1;
    104.16.0.0/13    1;
    104.24.0.0/14    1;
    108.162.192.0/18 1;
    131.0.72.0/22    1;
    141.101.64.0/18  1;
    162.158.0.0/15   1;
    172.64.0.0/13    1;
    173.245.48.0/20  1;
    188.114.96.0/20  1;
    190.93.240.0/20  1;
    197.234.240.0/22 1;
    198.41.128.0/17  1;
    # IPv6
    2400:cb00::/32   1;
    2606:4700::/32   1;
    2803:f800::/32   1;
    2405:b500::/32   1;
    2405:8100::/32   1;
    2a06:98c0::/29   1;
    2c0f:f248::/32   1;
}

# ─────────────────────────────────────────────────────────────
# Upstreams
# ─────────────────────────────────────────────────────────────
upstream web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream admin {
    server 127.0.0.1:3001;
    keepalive 16;
}

upstream api {
    server 127.0.0.1:4000;
    keepalive 64;
}

# ─────────────────────────────────────────────────────────────
# WebSocket upgrade map
# ─────────────────────────────────────────────────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─────────────────────────────────────────────────────────────
# Cloudflare real-IP extraction
# (set_real_ip_from + real_ip_header are NOT in default nginx.conf)
# ─────────────────────────────────────────────────────────────
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header    CF-Connecting-IP;
real_ip_recursive on;

# ─────────────────────────────────────────────────────────────
# Security + sizing
# ─────────────────────────────────────────────────────────────
server_tokens        off;
client_max_body_size 10m;

# ─────────────────────────────────────────────────────────────
# Gzip — extend defaults (nginx.conf has `gzip on` already)
# ─────────────────────────────────────────────────────────────
gzip_vary         on;
gzip_proxied      any;
gzip_comp_level   6;
gzip_buffers      16 8k;
gzip_http_version 1.1;
gzip_min_length   256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    application/atom+xml
    application/rss+xml
    image/svg+xml
    font/truetype
    font/opentype
    application/vnd.ms-fontobject;

# ─────────────────────────────────────────────────────────────
# SSL — shared settings (not in Ubuntu default nginx.conf)
# ─────────────────────────────────────────────────────────────
ssl_protocols             TLSv1.2 TLSv1.3;
ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
ssl_prefer_server_ciphers off;
ssl_session_cache         shared:SSL:10m;
ssl_session_timeout       1d;
ssl_session_tickets       off;
ssl_stapling              on;
ssl_stapling_verify       on;
resolver                  1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout          5s;

# ─────────────────────────────────────────────────────────────
# Default server — silently drop unknown vhosts
# ─────────────────────────────────────────────────────────────
server {
    listen 80  default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/habibazar.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/habibazar.ir/privkey.pem;

    return 444;
}

# ============================================================
# habibazar.ir + www — HTTP → HTTPS
# ============================================================
server {
    listen 80;
    server_name habibazar.ir www.habibazar.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# habibazar.ir + www — HTTPS / Next.js :3000
# ============================================================
server {
    listen 443 ssl;
    server_name habibazar.ir www.habibazar.ir;

    ssl_certificate     /etc/letsencrypt/live/habibazar.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/habibazar.ir/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"      always;

    # www → canonical
    if ($host = www.habibazar.ir) {
        return 301 https://habibazar.ir$request_uri;
    }

    # Next.js static — immutable cache
    location /_next/static/ {
        proxy_pass         http://web;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         Cache-Control "public, max-age=31536000, immutable" always;
        add_header         Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        access_log         off;
    }

    # Main app
    location / {
        proxy_pass         http://web;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass                   $http_upgrade;
        proxy_read_timeout                   60s;
        proxy_send_timeout                   60s;
        proxy_connect_timeout                10s;
    }
}

# ============================================================
# admin.habibazar.ir — HTTP → HTTPS
# ============================================================
server {
    listen 80;
    server_name admin.habibazar.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# admin.habibazar.ir — HTTPS / Next.js admin :3001
# ============================================================
server {
    listen 443 ssl;
    server_name admin.habibazar.ir;

    ssl_certificate     /etc/letsencrypt/live/admin.habibazar.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.habibazar.ir/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                       always;
    add_header X-Frame-Options           "DENY"                                          always;
    add_header X-Robots-Tag              "noindex, nofollow"                             always;
    add_header Referrer-Policy           "no-referrer"                                   always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"      always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.habibazar.ir; frame-ancestors 'none';" always;

    location /_next/static/ {
        proxy_pass         http://admin;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         Cache-Control "public, max-age=31536000, immutable" always;
        add_header         X-Robots-Tag "noindex, nofollow" always;
        access_log         off;
    }

    location / {
        proxy_pass         http://admin;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass                   $http_upgrade;
        proxy_read_timeout                   60s;
        proxy_send_timeout                   60s;
        proxy_connect_timeout                10s;
    }
}

# ============================================================
# api.habibazar.ir — HTTP → HTTPS
# ============================================================
server {
    listen 80;
    server_name api.habibazar.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# api.habibazar.ir — HTTPS / Express API :4000
# ============================================================
server {
    listen 443 ssl;
    server_name api.habibazar.ir;

    ssl_certificate     /etc/letsencrypt/live/api.habibazar.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.habibazar.ir/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                       always;
    add_header X-Frame-Options           "DENY"                                          always;
    add_header Referrer-Policy           "no-referrer"                                   always;

    # SSE / AI streaming — must be before the general location /
    location /api/v1/ai/ {
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering             off;
        proxy_read_timeout          300s;
        proxy_send_timeout          300s;
        chunked_transfer_encoding   on;
        proxy_cache                 off;
    }

    # General API
    location / {
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout                   60s;
        proxy_send_timeout                   60s;
        proxy_connect_timeout                10s;
    }
}
