# ============================================================
# Nginx Configuration — Habibazar Platform
# Place at: /etc/nginx/conf.d/habibazar.conf
# Hosts: habibazar.ir, www.habibazar.ir, api.habibazar.ir
# Admin panel: habibazar.ir/admin  (same Next.js app, port 3000)
# ============================================================

# ─────────────────────────────────────────────────────────────
# Cloudflare real-IP extraction
# ─────────────────────────────────────────────────────────────
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header   CF-Connecting-IP;
real_ip_recursive on;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─────────────────────────────────────────────────────────────
# Upstreams
# ─────────────────────────────────────────────────────────────
upstream web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream api {
    server 127.0.0.1:4000;
    keepalive 64;
}

# ─────────────────────────────────────────────────────────────
# Default server — drop unknown vhosts
# ─────────────────────────────────────────────────────────────
server {
    listen 80  default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# ============================================================
# habibazar.ir + www.habibazar.ir — HTTP → HTTPS redirect
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name habibazar.ir www.habibazar.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# habibazar.ir + www.habibazar.ir — HTTPS / Next.js :3000
# Admin panel available at /admin (no separate subdomain)
# ============================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name habibazar.ir www.habibazar.ir;

    ssl_certificate     /etc/letsencrypt/live/habibazar.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/habibazar.ir/privkey.pem;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                       always;
    add_header X-XSS-Protection          "1; mode=block"                                 always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"      always;

    # Redirect www → non-www (canonical)
    if ($host = www.habibazar.ir) {
        return 301 https://habibazar.ir$request_uri;
    }

    # Next.js static assets — immutable long-term cache
    location /_next/static/ {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        access_log off;
    }

    # Main Next.js app (includes /admin)
    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass                 $http_upgrade;
        proxy_read_timeout                 60s;
        proxy_send_timeout                 60s;
        proxy_connect_timeout              10s;
    }
}

# ============================================================
# api.habibazar.ir — HTTP → HTTPS redirect
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name api.habibazar.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# api.habibazar.ir — HTTPS / Express API :4000
# ============================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.habibazar.ir;

    ssl_certificate     /etc/letsencrypt/live/api.habibazar.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.habibazar.ir/privkey.pem;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                       always;
    add_header X-Frame-Options           "DENY"                                          always;
    add_header Referrer-Policy           "no-referrer"                                   always;

    # SSE / AI streaming endpoint — disable buffering, extend timeout
    location /api/v1/ai/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering             off;
        proxy_read_timeout          300s;
        proxy_send_timeout          300s;
        chunked_transfer_encoding   on;
        proxy_set_header Connection "";
        proxy_cache             off;
    }

    # General API
    location / {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout                 60s;
        proxy_send_timeout                 60s;
        proxy_connect_timeout              10s;
        client_max_body_size               10m;
    }
}
