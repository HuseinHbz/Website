<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56">
  <rect width="56" height="56" rx="12" fill="#0d1117"/>
  <defs><linearGradient id="mi" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient></defs>
  <!-- screen -->
  <rect x="8" y="12" width="36" height="24" rx="3" fill="url(#mi)" opacity="0.08" stroke="#f59e0b" stroke-width="1.2"/>
  <!-- graph line -->
  <polyline points="12,30 16,26 20,28 24,20 28,24 32,18 36,22 40,16" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- area fill -->
  <polygon points="12,30 16,26 20,28 24,20 28,24 32,18 36,22 40,16 40,32 12,32" fill="#f59e0b" opacity="0.08"/>
  <!-- alert dot -->
  <circle cx="40" cy="16" r="3" fill="#ef4444"/>
  <circle cx="40" cy="16" r="1.5" fill="white"/>
  <!-- stand -->
  <line x1="26" y1="36" x2="26" y2="42" stroke="#f59e0b" stroke-width="1.5" opacity="0.6"/>
  <line x1="20" y1="42" x2="32" y2="42" stroke="#f59e0b" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  <!-- axis labels -->
  <line x1="8" y1="36" x2="44" y2="36" stroke="#f59e0b" stroke-width="0.6" opacity="0.3"/>
  <line x1="8" y1="12" x2="8" y2="36" stroke="#f59e0b" stroke-width="0.6" opacity="0.3"/>
</svg>
