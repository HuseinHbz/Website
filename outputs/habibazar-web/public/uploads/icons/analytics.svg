  <!-- up arrow -->
  <path d="M44,14 L48,10 L52,14" fill="none" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="48" y1="10" x2="48" y2="20" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
