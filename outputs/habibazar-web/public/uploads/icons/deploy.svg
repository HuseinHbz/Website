<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56">
  <rect width="56" height="56" rx="12" fill="#0d1117"/>
  <defs><linearGradient id="dpi" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient></defs>
  <!-- rocket -->
  <path d="M28,8 Q34,12 36,22 L36,36 Q32,40 28,42 Q24,40 20,36 L20,22 Q22,12 28,8 Z" fill="url(#dpi)" opacity="0.15" stroke="url(#dpi)" stroke-width="1.5"/>
  <!-- rocket window -->
  <circle cx="28" cy="22" r="5" fill="none" stroke="#34d399" stroke-width="1.2"/>
  <circle cx="28" cy="22" r="2.5" fill="#10b981" opacity="0.5"/>
  <!-- fins -->
  <path d="M20,30 L14,40 L20,36" fill="#10b981" opacity="0.3" stroke="#10b981" stroke-width="1"/>
  <path d="M36,30 L42,40 L36,36" fill="#06b6d4" opacity="0.3" stroke="#06b6d4" stroke-width="1"/>
  <!-- exhaust flames -->
  <path d="M24,42 Q28,50 32,42" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <path d="M26,42 Q28,46 30,42" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <!-- stars -->
  <circle cx="12" cy="16" r="1" fill="#818cf8" opacity="0.6"/>
  <circle cx="44" cy="12" r="1" fill="#818cf8" opacity="0.5"/>
  <circle cx="10" cy="28" r="0.8" fill="#818cf8" opacity="0.4"/>
  <circle cx="46" cy="24" r="0.8" fill="#818cf8" opacity="0.4"/>
