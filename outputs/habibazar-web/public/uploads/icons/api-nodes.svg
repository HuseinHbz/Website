<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56">
  <rect width="56" height="56" rx="12" fill="#0d1117"/>
  <defs><linearGradient id="api" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0284c7"/></linearGradient></defs>
  <!-- central API node -->
  <rect x="19" y="20" width="18" height="16" rx="3" fill="url(#api)" opacity="0.15" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="28" y="30" text-anchor="middle" fill="#67e8f9" font-size="6" font-weight="700" font-family="monospace">API</text>
  <!-- endpoint nodes -->
  <circle cx="8" cy="16" r="5" fill="#06b6d4" opacity="0.12" stroke="#06b6d4" stroke-width="1"/>
  <text x="8" y="18" text-anchor="middle" fill="#67e8f9" font-size="4" font-family="monospace">GET</text>
  <circle cx="8" cy="36" r="5" fill="#10b981" opacity="0.12" stroke="#10b981" stroke-width="1"/>
  <text x="8" y="38" text-anchor="middle" fill="#34d399" font-size="4" font-family="monospace">POST</text>
  <circle cx="48" cy="16" r="5" fill="#f59e0b" opacity="0.12" stroke="#f59e0b" stroke-width="1"/>
  <text x="48" y="18" text-anchor="middle" fill="#fbbf24" font-size="3.5" font-family="monospace">PUT</text>
  <circle cx="48" cy="36" r="5" fill="#ef4444" opacity="0.12" stroke="#ef4444" stroke-width="1"/>
  <text x="48" y="38" text-anchor="middle" fill="#fca5a5" font-size="3" font-family="monospace">DEL</text>
  <!-- connection lines -->
  <line x1="13" y1="18" x2="19" y2="24" stroke="#06b6d4" stroke-width="1" opacity="0.5"/>
  <line x1="13" y1="34" x2="19" y2="32" stroke="#10b981" stroke-width="1" opacity="0.5"/>
  <line x1="43" y1="18" x2="37" y2="24" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
  <line x1="43" y1="34" x2="37" y2="32" stroke="#ef4444" stroke-width="1" opacity="0.5"/>
  <!-- bottom endpoints -->
  <circle cx="20" cy="48" r="4" fill="#8b5cf6" opacity="0.12" stroke="#8b5cf6" stroke-width="1"/>
  <circle cx="36" cy="48" r="4" fill="#ec4899" opacity="0.12" stroke="#ec4899" stroke-width="1"/>
  <line x1="22" y1="44" x2="24" y2="36" stroke="#8b5cf6" stroke-width="1" opacity="0.4"/>
  <line x1="34" y1="44" x2="32" y2="36" stroke="#ec4899" stroke-width="1" opacity="0.4"/>
</svg>
