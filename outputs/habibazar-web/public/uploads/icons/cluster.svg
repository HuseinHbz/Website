<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56">
  <rect width="56" height="56" rx="12" fill="#0d1117"/>
  <defs><linearGradient id="cli" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#818cf8"/></linearGradient></defs>
  <!-- 4 nodes cluster -->
  <rect x="8" y="8" width="16" height="16" rx="4" fill="url(#cli)" opacity="0.15" stroke="#6366f1" stroke-width="1.2"/>
  <rect x="32" y="8" width="16" height="16" rx="4" fill="url(#cli)" opacity="0.15" stroke="#6366f1" stroke-width="1.2"/>
  <rect x="8" y="32" width="16" height="16" rx="4" fill="url(#cli)" opacity="0.15" stroke="#6366f1" stroke-width="1.2"/>
  <rect x="32" y="32" width="16" height="16" rx="4" fill="url(#cli)" opacity="0.15" stroke="#818cf8" stroke-width="1.5"/>
  <!-- active node indicator -->
  <rect x="32" y="32" width="16" height="16" rx="4" fill="#818cf8" opacity="0.06"/>
  <!-- mini icons in nodes -->
  <circle cx="16" cy="16" r="4" fill="#6366f1" opacity="0.6"/>
  <circle cx="40" cy="16" r="4" fill="#6366f1" opacity="0.6"/>
  <circle cx="16" cy="40" r="4" fill="#6366f1" opacity="0.6"/>
  <circle cx="40" cy="40" r="4" fill="#818cf8" opacity="0.9"/>
  <circle cx="40" cy="40" r="2" fill="#e0e7ff"/>
  <!-- mesh connections -->
  <line x1="24" y1="16" x2="32" y2="16" stroke="#6366f1" stroke-width="1" opacity="0.5"/>
  <line x1="16" y1="24" x2="16" y2="32" stroke="#6366f1" stroke-width="1" opacity="0.5"/>
  <line x1="24" y1="40" x2="32" y2="40" stroke="#818cf8" stroke-width="1.5" opacity="0.7"/>
  <line x1="40" y1="24" x2="40" y2="32" stroke="#818cf8" stroke-width="1.5" opacity="0.7"/>
  <line x1="24" y1="24" x2="32" y2="32" stroke="#6366f1" stroke-width="0.8" opacity="0.3" stroke-dasharray="2 2"/>
  <line x1="32" y1="24" x2="24" y2="32" stroke="#6366f1" stroke-width="0.8" opacity="0.3" stroke-dasharray="2 2"/>
</svg>
