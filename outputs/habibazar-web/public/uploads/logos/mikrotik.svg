<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <rect width="80" height="80" fill="#0d0d17" rx="10"/>
  <rect x="8" y="8" width="64" height="64" fill="#c03030" fill-opacity="0.15" rx="8"/>
  <!-- Router body -->
  <rect x="16" y="28" width="48" height="18" fill="none" stroke="#c03030" stroke-width="2.5" rx="3"/>
  <!-- Antenna left -->
  <line x1="24" y1="28" x2="20" y2="18" stroke="#c03030" stroke-width="2"/>
  <circle cx="20" cy="17" r="2" fill="#c03030"/>
  <!-- Antenna right -->
  <line x1="56" y1="28" x2="60" y2="18" stroke="#c03030" stroke-width="2"/>
  <circle cx="60" cy="17" r="2" fill="#c03030"/>
  <!-- Ports row -->
  <rect x="22" y="33" width="4" height="7" fill="none" stroke="#c03030" stroke-width="1.5" rx="1"/>
  <rect x="30" y="33" width="4" height="7" fill="none" stroke="#c03030" stroke-width="1.5" rx="1"/>
  <rect x="38" y="33" width="4" height="7" fill="none" stroke="#c03030" stroke-width="1.5" rx="1"/>
  <rect x="46" y="33" width="4" height="7" fill="none" stroke="#c03030" stroke-width="1.5" rx="1"/>
  <!-- LED -->
  <circle cx="56" cy="36" r="2" fill="#c03030"/>
  <text x="40" y="58" text-anchor="middle" fill="#c03030" font-family="Arial,sans-serif" font-size="8" font-weight="bold">MikroTik</text>
</svg>
