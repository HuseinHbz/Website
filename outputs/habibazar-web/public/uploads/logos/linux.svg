<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <rect width="80" height="80" fill="#0d0d17" rx="10"/>
  <rect x="8" y="8" width="64" height="64" fill="#f59e0b" fill-opacity="0.15" rx="8"/>
  <!-- Penguin body -->
  <ellipse cx="40" cy="38" rx="12" ry="15" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <!-- Penguin head -->
  <circle cx="40" cy="22" r="8" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <!-- Eyes -->
  <circle cx="37" cy="20" r="1.5" fill="#f59e0b"/>
  <circle cx="43" cy="20" r="1.5" fill="#f59e0b"/>
  <!-- Beak -->
  <polygon points="40,23 37.5,26 42.5,26" fill="#f59e0b"/>
  <!-- Belly -->
  <ellipse cx="40" cy="40" rx="6" ry="9" fill="#f59e0b" fill-opacity="0.3"/>
  <!-- Feet -->
  <line x1="34" y1="53" x2="30" y2="57" stroke="#f59e0b" stroke-width="2"/>
  <line x1="46" y1="53" x2="50" y2="57" stroke="#f59e0b" stroke-width="2"/>
  <text x="40" y="70" text-anchor="middle" fill="#f59e0b" font-family="Arial,sans-serif" font-size="9" font-weight="bold">Linux</text>
</svg>
