<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <rect width="80" height="80" fill="#0d0d17" rx="10"/>
  <rect x="8" y="8" width="64" height="64" fill="#ee0000" fill-opacity="0.15" rx="8"/>
  <!-- Gear shape -->
  <circle cx="40" cy="36" r="10" fill="none" stroke="#ee0000" stroke-width="2.5"/>
  <circle cx="40" cy="36" r="4" fill="#ee0000"/>
  <!-- Gear teeth -->
  <rect x="37" y="22" width="6" height="6" fill="#ee0000" rx="1"/>
  <rect x="37" y="44" width="6" height="6" fill="#ee0000" rx="1"/>
  <rect x="22" y="33" width="6" height="6" fill="#ee0000" rx="1"/>
  <rect x="52" y="33" width="6" height="6" fill="#ee0000" rx="1"/>
  <!-- Diagonal teeth -->
  <rect x="27" y="25" width="6" height="6" fill="#ee0000" rx="1" transform="rotate(45 30 28)"/>
  <rect x="47" y="25" width="6" height="6" fill="#ee0000" rx="1" transform="rotate(45 50 28)"/>
  <rect x="27" y="41" width="6" height="6" fill="#ee0000" rx="1" transform="rotate(45 30 44)"/>
  <rect x="47" y="41" width="6" height="6" fill="#ee0000" rx="1" transform="rotate(45 50 44)"/>
  <text x="40" y="66" text-anchor="middle" fill="#ee0000" font-family="Arial,sans-serif" font-size="9" font-weight="bold">Ansible</text>
</svg>
