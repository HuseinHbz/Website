<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0a1a0a"/><stop offset="100%" stop-color="#050a05"/></linearGradient>
    <linearGradient id="lg8" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
    <filter id="gf8"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <circle cx="80" cy="80" r="80" fill="url(#bg8)"/>
  <!-- concentric hexagons -->
  <polygon points="80,18 120,40 120,120 80,142 40,120 40,40" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
