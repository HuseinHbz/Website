  <circle cx="80" cy="20" r="3" fill="#10b981" opacity="0.8"/>
  <circle cx="118" cy="41" r="2" fill="#06b6d4" opacity="0.6"/>
  <circle cx="118" cy="119" r="2" fill="#06b6d4" opacity="0.6"/>
  <circle cx="80" cy="140" r="3" fill="#10b981" opacity="0.8"/>
  <text x="80" y="153" text-anchor="middle" fill="#34d399" font-size="7" font-weight="700" font-family="monospace">HEX-08</text>
