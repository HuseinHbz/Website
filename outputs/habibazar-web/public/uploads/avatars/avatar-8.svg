  <polygon points="80,42 100,54 100,106 80,118 60,106 60,54" fill="none" stroke="#06b6d4" stroke-width="0.8" opacity="0.3"/>
  <polygon points="80,54 90,61 90,99 80,106 70,99 70,61" fill="url(#lg8)" opacity="0.12" stroke="#06b6d4" stroke-width="1"/>
  <!-- honeycomb cells -->
  <polygon points="80,62 87,66 87,74 80,78 73,74 73,66" fill="#10b981" opacity="0.2"/>
  <polygon points="80,62 87,66 87,74 80,78 73,74 73,66" fill="none" stroke="#10b981" stroke-width="0.8"/>
  <!-- glow dot -->
  <circle cx="80" cy="70" r="6" fill="url(#lg8)" opacity="0.9" filter="url(#gf8)"/>
  <circle cx="80" cy="70" r="3" fill="white" opacity="0.5"/>
