<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="50%"><stop offset="0%" stop-color="#0d1a0d"/><stop offset="100%" stop-color="#050a05"/></radialGradient>
    <filter id="gf3"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="neon3"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="80" cy="80" r="80" fill="url(#bg3)"/>
  <circle cx="80" cy="80" r="75" fill="none" stroke="#10b981" stroke-width="1" opacity="0.4"/>
  <!-- neon glow -->
  <circle cx="80" cy="65" r="45" fill="#10b981" opacity="0.07" filter="url(#gf3)"/>
  <!-- pixel art style character -->
  <!-- head -->
  <rect x="60" y="35" width="40" height="45" rx="4" fill="#10b981" opacity="0.15" stroke="#10b981" stroke-width="1" filter="url(#neon3)"/>
  <!-- pixel eyes -->
  <rect x="68" y="50" width="8" height="8" rx="2" fill="#10b981" opacity="0.9"/>
  <rect x="84" y="50" width="8" height="8" rx="2" fill="#10b981" opacity="0.9"/>
  <rect x="70" y="52" width="4" height="4" fill="#d1fae5"/>
  <rect x="86" y="52" width="4" height="4" fill="#d1fae5"/>
  <!-- mouth scan -->
  <rect x="68" y="67" width="24" height="4" rx="2" fill="#10b981" opacity="0.5"/>
  <rect x="70" y="68" width="4" height="2" fill="#10b981"/>
  <rect x="76" y="68" width="4" height="2" fill="#10b981"/>
  <rect x="82" y="68" width="4" height="2" fill="#10b981"/>
  <!-- body -->
  <rect x="55" y="82" width="50" height="35" rx="3" fill="#10b981" opacity="0.08" stroke="#10b981" stroke-width="0.8"/>
  <!-- chest emblem -->
  <polygon points="80,88 86,95 80,102 74,95" fill="none" stroke="#10b981" stroke-width="1" opacity="0.8"/>
  <circle cx="80" cy="95" r="2" fill="#10b981"/>
  <!-- scan lines -->
  <line x1="55" y1="90" x2="105" y2="90" stroke="#10b981" stroke-width="0.4" opacity="0.4"/>
  <line x1="55" y1="100" x2="105" y2="100" stroke="#10b981" stroke-width="0.4" opacity="0.4"/>
  <line x1="55" y1="110" x2="105" y2="110" stroke="#10b981" stroke-width="0.4" opacity="0.4"/>
  <text x="80" y="132" text-anchor="middle" fill="#10b981" font-size="7" font-weight="700" font-family="monospace" opacity="0.9">PIXEL-03</text>
</svg>
