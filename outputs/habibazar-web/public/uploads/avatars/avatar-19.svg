  <!-- face in matrix green -->
  <ellipse cx="80" cy="68" rx="26" ry="28" fill="#10b981" opacity="0.06" stroke="#10b981" stroke-width="1.5"/>
  <!-- eyes - code symbols -->
  <text x="68" y="65" text-anchor="middle" fill="#10b981" font-size="11" font-family="monospace" font-weight="700">&lt;/&gt;</text>
  <text x="93" y="65" text-anchor="middle" fill="#10b981" font-size="11" font-family="monospace" font-weight="700">{ }</text>
  <!-- mouth - prompt -->
  <text x="80" y="80" text-anchor="middle" fill="#10b981" font-size="7" font-family="monospace" opacity="0.8">$ &gt;_</text>
  <!-- shoulders line of code -->
  <text x="80" y="100" text-anchor="middle" fill="#10b981" font-size="5" font-family="monospace" opacity="0.5">const me = hbz()</text>
  <text x="80" y="108" text-anchor="middle" fill="#10b981" font-size="5" font-family="monospace" opacity="0.4">return { infra: ∞ }</text>
  <text x="80" y="138" text-anchor="middle" fill="#34d399" font-size="7" font-weight="700" font-family="monospace">MATRIX-19</text>
