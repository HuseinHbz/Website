<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <defs>
    <linearGradient id="bg19" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#001510"/><stop offset="100%" stop-color="#000508"/></linearGradient>
    <linearGradient id="matrix19" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/><stop offset="100%" stop-color="#10b981" stop-opacity="0.1"/></linearGradient>
  </defs>
  <circle cx="80" cy="80" r="80" fill="url(#bg19)"/>
  <!-- matrix rain columns -->
  <g font-size="5" font-family="monospace" fill="#10b981">
    <text x="25" y="20" opacity="0.8">1</text><text x="25" y="28" opacity="0.6">0</text><text x="25" y="36" opacity="0.4">1</text><text x="25" y="44" opacity="0.2">0</text>
    <text x="40" y="30" opacity="0.7">0</text><text x="40" y="38" opacity="0.5">1</text><text x="40" y="46" opacity="0.3">0</text>
    <text x="115" y="22" opacity="0.8">1</text><text x="115" y="30" opacity="0.6">1</text><text x="115" y="38" opacity="0.4">0</text>
    <text x="128" y="28" opacity="0.7">0</text><text x="128" y="36" opacity="0.5">1</text>
    <text x="20" y="100" opacity="0.5">1</text><text x="20" y="108" opacity="0.3">0</text>
    <text x="130" y="95" opacity="0.5">0</text><text x="130" y="103" opacity="0.3">1</text>
