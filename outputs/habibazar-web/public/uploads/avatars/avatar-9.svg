<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <defs>
    <radialGradient id="bg9" cx="50%" cy="50%"><stop offset="0%" stop-color="#1a1000"/><stop offset="100%" stop-color="#080500"/></radialGradient>
    <radialGradient id="sun9" cx="50%" cy="50%"><stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/><stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
    <filter id="gf9"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <circle cx="80" cy="80" r="80" fill="url(#bg9)"/>
  <!-- sun rays -->
  <circle cx="80" cy="80" r="55" fill="url(#sun9)" filter="url(#gf9)"/>
  <g stroke="#f59e0b" stroke-width="1" opacity="0.5">
    <line x1="80" y1="15" x2="80" y2="28"/><line x1="80" y1="132" x2="80" y2="145"/>
    <line x1="15" y1="80" x2="28" y2="80"/><line x1="132" y1="80" x2="145" y2="80"/>
    <line x1="29" y1="29" x2="38" y2="38"/><line x1="131" y1="29" x2="122" y2="38"/>
    <line x1="29" y1="131" x2="38" y2="122"/><line x1="131" y1="131" x2="122" y2="122"/>
  </g>
  <!-- mandala rings -->
  <circle cx="80" cy="80" r="45" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.3" stroke-dasharray="5 5"/>
  <circle cx="80" cy="80" r="35" fill="none" stroke="#fbbf24" stroke-width="0.8" opacity="0.4"/>
  <!-- petal pattern -->
  <g fill="#f59e0b" opacity="0.15">
    <ellipse cx="80" cy="60" rx="8" ry="16" transform="rotate(0 80 80)"/>
    <ellipse cx="80" cy="60" rx="8" ry="16" transform="rotate(45 80 80)"/>
    <ellipse cx="80" cy="60" rx="8" ry="16" transform="rotate(90 80 80)"/>
    <ellipse cx="80" cy="60" rx="8" ry="16" transform="rotate(135 80 80)"/>
  </g>
  <circle cx="80" cy="80" r="20" fill="#f59e0b" opacity="0.1" stroke="#fbbf24" stroke-width="1"/>
  <circle cx="80" cy="80" r="10" fill="#f59e0b" opacity="0.8"/>
  <circle cx="80" cy="80" r="5" fill="#fef3c7"/>
  <text x="80" y="148" text-anchor="middle" fill="#fbbf24" font-size="7" font-weight="700" font-family="monospace">SOLAR-09</text>
</svg>
