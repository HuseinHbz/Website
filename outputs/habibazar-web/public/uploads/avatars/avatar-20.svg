  <path d="M58,40 Q55,25 65,20 Q80,15 95,20 Q105,25 102,40" fill="#6366f1" opacity="0.25" stroke="#818cf8" stroke-width="1"/>
  <!-- eyes - modern geometric -->
  <circle cx="70" cy="56" r="7" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
  <circle cx="90" cy="56" r="7" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
  <circle cx="70" cy="56" r="3.5" fill="#06b6d4" opacity="0.9"/>
  <circle cx="90" cy="56" r="3.5" fill="#06b6d4" opacity="0.9"/>
  <circle cx="68" cy="54" r="1.2" fill="white" opacity="0.6"/>
  <circle cx="88" cy="54" r="1.2" fill="white" opacity="0.6"/>
  <!-- nose minimal -->
  <line x1="78" y1="62" x2="76" y2="70" stroke="#c7d2fe" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="82" y1="62" x2="84" y2="70" stroke="#c7d2fe" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <!-- smile -->
  <path d="M71,78 Q80,83 89,78" fill="none" stroke="#c7d2fe" stroke-width="1.5" stroke-linecap="round"/>
  <!-- neck & shoulders -->
  <line x1="75" y1="90" x2="70" y2="108" stroke="#c7d2fe" stroke-width="1.5" opacity="0.5"/>
  <line x1="85" y1="90" x2="90" y2="108" stroke="#c7d2fe" stroke-width="1.5" opacity="0.5"/>
  <path d="M45,108 Q60,102 80,100 Q100,102 115,108" fill="none" stroke="#c7d2fe" stroke-width="1.5" opacity="0.5"/>
  <text x="80" y="130" text-anchor="middle" fill="#818cf8" font-size="7" font-weight="700" font-family="monospace">AURORA-20</text>
