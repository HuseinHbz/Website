<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <defs>
    <radialGradient id="bg20" cx="50%" cy="50%"><stop offset="0%" stop-color="#0a0a20"/><stop offset="100%" stop-color="#050510"/></radialGradient>
    <linearGradient id="aurora20" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/><stop offset="33%" stop-color="#06b6d4" stop-opacity="0.4"/><stop offset="66%" stop-color="#10b981" stop-opacity="0.4"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0.6"/></linearGradient>
    <filter id="aurora_blur"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <circle cx="80" cy="80" r="80" fill="url(#bg20)"/>
  <!-- aurora background -->
  <rect x="0" y="20" width="160" height="80" fill="url(#aurora20)" filter="url(#aurora_blur)" opacity="0.6"/>
  <!-- minimalist face - clean modern -->
