<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <defs>
    <radialGradient id="bg1" cx="40%" cy="35%"><stop offset="0%" stop-color="#1a1a3e"/><stop offset="100%" stop-color="#05050f"/></radialGradient>
    <radialGradient id="glow1" cx="50%" cy="40%"><stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <filter id="f1"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gf"><feGaussianBlur stdDeviation="8"/></filter>
    <clipPath id="c1"><circle cx="80" cy="80" r="76"/></clipPath>
  </defs>
  <circle cx="80" cy="80" r="80" fill="url(#bg1)"/>
  <circle cx="80" cy="80" r="76" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.5"/>
  <circle cx="80" cy="80" r="60" fill="none" stroke="#6366f1" stroke-width="0.5" opacity="0.25" stroke-dasharray="4 3"/>
  <!-- glow -->
  <circle cx="80" cy="55" r="40" fill="url(#glow1)" filter="url(#gf)"/>
  <!-- circuit lines -->
  <g clip-path="url(#c1)" opacity="0.3" stroke="#818cf8" stroke-width="0.8" fill="none">
    <line x1="20" y1="80" x2="140" y2="80"/><line x1="80" y1="20" x2="80" y2="140"/>
    <line x1="35" y1="35" x2="125" y2="125"/><line x1="125" y1="35" x2="35" y2="125"/>
    <circle cx="80" cy="80" r="30"/><circle cx="80" cy="80" r="50"/>
  </g>
  <!-- face shape -->
  <ellipse cx="80" cy="62" rx="24" ry="26" fill="#6366f1" opacity="0.18" filter="url(#f1)"/>
  <ellipse cx="80" cy="62" rx="18" ry="20" fill="none" stroke="#818cf8" stroke-width="1.2" opacity="0.8"/>
  <!-- eyes -->
  <ellipse cx="70" cy="58" rx="5" ry="4" fill="#6366f1" opacity="0.9"/>
  <ellipse cx="90" cy="58" rx="5" ry="4" fill="#6366f1" opacity="0.9"/>
  <circle cx="70" cy="58" r="2" fill="#c7d2fe"/>
  <circle cx="90" cy="58" r="2" fill="#c7d2fe"/>
  <!-- data scan line -->
  <line x1="56" y1="62" x2="104" y2="62" stroke="#06b6d4" stroke-width="0.8" opacity="0.7"/>
  <!-- shoulders -->
  <path d="M50,115 Q56,90 80,85 Q104,90 110,115" fill="#6366f1" opacity="0.15" stroke="#818cf8" stroke-width="1" fill-rule="evenodd"/>
  <!-- hud badge -->
  <rect x="62" y="125" width="36" height="14" rx="7" fill="#6366f1" opacity="0.25" stroke="#818cf8" stroke-width="0.8"/>
  <text x="80" y="135.5" text-anchor="middle" fill="#c7d2fe" font-size="7" font-weight="700" font-family="monospace">HBZ-01</text>
</svg>
