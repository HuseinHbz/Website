<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <defs>
    <radialGradient id="bg15" cx="50%" cy="50%"><stop offset="0%" stop-color="#1a1400"/><stop offset="100%" stop-color="#080600"/></radialGradient>
    <radialGradient id="ore15" cx="50%" cy="50%"><stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/><stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
    <filter id="gf15"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="glow15"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="80" cy="80" r="80" fill="url(#bg15)"/>
  <!-- dwarf/golem stone texture suggestion -->
  <circle cx="80" cy="80" r="70" fill="url(#ore15)" filter="url(#gf15)"/>
  <!-- cracks/runes pattern -->
  <g stroke="#f59e0b" stroke-width="0.6" opacity="0.3">
    <line x1="50" y1="40" x2="60" y2="55"/><line x1="60" y1="55" x2="55" y2="70"/>
    <line x1="110" y1="40" x2="100" y2="55"/><line x1="100" y1="55" x2="105" y2="70"/>
    <line x1="40" y1="90" x2="55" y2="95"/><line x1="120" y1="90" x2="105" y2="95"/>
  </g>
  <!-- golem/dwarf head - stocky -->
  <rect x="55" y="40" width="50" height="55" rx="10" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="1.5" filter="url(#glow15)"/>
  <!-- massive beard -->
  <path d="M55,75 Q60,95 80,100 Q100,95 105,75 L100,115 Q80,125 60,115 Z" fill="#f59e0b" opacity="0.2" stroke="#fbbf24" stroke-width="1"/>
  <!-- braid beads -->
  <circle cx="70" cy="105" r="3" fill="#f59e0b" opacity="0.6"/>
  <circle cx="80" cy="108" r="3" fill="#f59e0b" opacity="0.6"/>
  <circle cx="90" cy="105" r="3" fill="#f59e0b" opacity="0.6"/>
  <!-- eyes - glowing ore -->
  <circle cx="70" cy="60" r="6" fill="#f59e0b" opacity="0.4" filter="url(#gf15)"/>
  <circle cx="90" cy="60" r="6" fill="#f59e0b" opacity="0.4" filter="url(#gf15)"/>
  <circle cx="70" cy="60" r="4" fill="#fbbf24" opacity="0.9"/>
  <circle cx="90" cy="60" r="4" fill="#fbbf24" opacity="0.9"/>
  <!-- rune tattoo on forehead -->
  <text x="80" y="55" text-anchor="middle" fill="#fbbf24" font-size="8" font-family="serif" opacity="0.8">ᚠ</text>
  <text x="80" y="140" text-anchor="middle" fill="#fbbf24" font-size="7" font-weight="700" font-family="monospace">DWARF-15</text>
</svg>
