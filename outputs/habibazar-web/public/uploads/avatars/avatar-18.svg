<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <defs>
    <linearGradient id="bg18" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#070720"/><stop offset="100%" stop-color="#030310"/></linearGradient>
    <linearGradient id="chip18" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#818cf8"/></linearGradient>
  </defs>
  <circle cx="80" cy="80" r="80" fill="url(#bg18)"/>
  <!-- circuit board face -->
  <rect x="50" y="35" width="60" height="70" rx="6" fill="url(#chip18)" opacity="0.06" stroke="#6366f1" stroke-width="1.5"/>
  <!-- chip grid -->
  <g stroke="#6366f1" stroke-width="0.5" opacity="0.4">
    <line x1="60" y1="35" x2="60" y2="105"/><line x1="70" y1="35" x2="70" y2="105"/>
    <line x1="80" y1="35" x2="80" y2="105"/><line x1="90" y1="35" x2="90" y2="105"/>
    <line x1="100" y1="35" x2="100" y2="105"/>
    <line x1="50" y1="50" x2="110" y2="50"/><line x1="50" y1="65" x2="110" y2="65"/>
    <line x1="50" y1="80" x2="110" y2="80"/><line x1="50" y1="95" x2="110" y2="95"/>
  </g>
  <!-- processor units (eyes) -->
  <rect x="58" y="52" width="16" height="12" rx="2" fill="#6366f1" opacity="0.25" stroke="#818cf8" stroke-width="1.2"/>
  <rect x="86" y="52" width="16" height="12" rx="2" fill="#6366f1" opacity="0.25" stroke="#818cf8" stroke-width="1.2"/>
  <circle cx="66" cy="58" r="4" fill="#818cf8" opacity="0.9"/>
  <circle cx="94" cy="58" r="4" fill="#818cf8" opacity="0.9"/>
  <circle cx="66" cy="58" r="2" fill="#e0e7ff"/>
  <circle cx="94" cy="58" r="2" fill="#e0e7ff"/>
  <!-- data port mouth -->
  <rect x="63" y="74" width="34" height="8" rx="2" fill="#6366f1" opacity="0.2" stroke="#818cf8" stroke-width="0.8"/>
  <g fill="#818cf8" opacity="0.6">
    <circle cx="69" cy="78" r="1.5"/><circle cx="75" cy="78" r="1.5"/>
    <circle cx="81" cy="78" r="1.5"/><circle cx="87" cy="78" r="1.5"/>
    <circle cx="93" cy="78" r="1.5"/>
  </g>
  <!-- pins -->
  <g stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <line x1="50" y1="48" x2="44" y2="48"/><line x1="50" y1="58" x2="44" y2="58"/>
    <line x1="50" y1="68" x2="44" y2="68"/><line x1="50" y1="78" x2="44" y2="78"/>
    <line x1="110" y1="48" x2="116" y2="48"/><line x1="110" y1="58" x2="116" y2="58"/>
    <line x1="110" y1="68" x2="116" y2="68"/><line x1="110" y1="78" x2="116" y2="78"/>
  </g>
  <text x="80" y="120" text-anchor="middle" fill="#818cf8" font-size="5.5" font-family="monospace" opacity="0.7">CPU-FACE v2.4</text>
  <text x="80" y="138" text-anchor="middle" fill="#818cf8" font-size="7" font-weight="700" font-family="monospace">CHIP-18</text>
</svg>
