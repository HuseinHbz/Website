<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <rect width="80" height="80" fill="#0d0d17" rx="10"/>
  <rect x="8" y="8" width="64" height="64" fill="#854d0e" fill-opacity="0.2" rx="8"/>
  <!-- Building shape -->
  <rect x="22" y="28" width="36" height="28" fill="none" stroke="#d4a017" stroke-width="2.5"/>
  <!-- Roof -->
