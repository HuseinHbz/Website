  <rect x="37" y="33" width="7" height="7" fill="#d4a017" fill-opacity="0.4" stroke="#d4a017" stroke-width="1"/>
  <rect x="47" y="33" width="7" height="7" fill="#d4a017" fill-opacity="0.4" stroke="#d4a017" stroke-width="1"/>
  <!-- Door -->
  <rect x="34" y="44" width="12" height="12" fill="none" stroke="#d4a017" stroke-width="1.5"/>
  <text x="40" y="68" text-anchor="middle" fill="#d4a017" font-family="Arial,sans-serif" font-size="9" font-weight="bold">Enterprise</text>
</svg>
