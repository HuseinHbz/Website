<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <rect width="80" height="80" fill="#0d0d17" rx="10"/>
  <rect x="8" y="8" width="64" height="64" fill="#1e3a5f" fill-opacity="0.3" rx="8"/>
  <!-- Columns (capitol building style) -->
  <rect x="16" y="52" width="48" height="4" fill="#3b5ea6"/>
  <rect x="16" y="28" width="48" height="4" fill="#3b5ea6"/>
  <!-- Pillars -->
  <rect x="22" y="32" width="5" height="20" fill="none" stroke="#3b5ea6" stroke-width="2"/>
  <rect x="32" y="32" width="5" height="20" fill="none" stroke="#3b5ea6" stroke-width="2"/>
  <rect x="43" y="32" width="5" height="20" fill="none" stroke="#3b5ea6" stroke-width="2"/>
  <rect x="53" y="32" width="5" height="20" fill="none" stroke="#3b5ea6" stroke-width="2"/>
  <!-- Pediment (triangle roof) -->
  <polygon points="12,28 40,14 68,28" fill="none" stroke="#3b5ea6" stroke-width="2.5"/>
  <!-- Steps -->
  <rect x="20" y="56" width="40" height="3" fill="#3b5ea6" fill-opacity="0.5"/>
  <rect x="18" y="59" width="44" height="3" fill="#3b5ea6" fill-opacity="0.3"/>
  <text x="40" y="70" text-anchor="middle" fill="#3b5ea6" font-family="Arial,sans-serif" font-size="10" font-weight="bold">Gov</text>
</svg>
