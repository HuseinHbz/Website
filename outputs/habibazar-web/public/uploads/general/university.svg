<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <rect width="80" height="80" fill="#0d0d17" rx="10"/>
  <rect x="8" y="8" width="64" height="64" fill="#4c1d95" fill-opacity="0.2" rx="8"/>
  <!-- Graduation cap board -->
  <polygon points="40,18 62,28 40,38 18,28" fill="none" stroke="#8b5cf6" stroke-width="2.5"/>
  <!-- Top of cap -->
  <rect x="34" y="14" width="12" height="6" fill="#8b5cf6" fill-opacity="0.4" stroke="#8b5cf6" stroke-width="1.5" rx="1"/>
  <!-- Tassel string -->
  <line x1="62" y1="28" x2="62" y2="40" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="62" cy="42" r="3" fill="#8b5cf6"/>
  <!-- Diploma/book below -->
  <rect x="26" y="42" width="28" height="16" fill="none" stroke="#8b5cf6" stroke-width="1.5" rx="2"/>
  <line x1="26" y1="50" x2="54" y2="50" stroke="#8b5cf6" stroke-width="1"/>
  <text x="40" y="70" text-anchor="middle" fill="#8b5cf6" font-family="Arial,sans-serif" font-size="8.5" font-weight="bold">University</text>
</svg>
